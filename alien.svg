<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#1a2352"/>
      <stop offset="100%" stop-color="#0a0e1f"/>
    </radialGradient>
    <radialGradient id="alien" cx="38%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#8affb0"/>
      <stop offset="100%" stop-color="#1f9e4d"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- stars -->
  <g fill="#cfe4ff" opacity="0.9">
    <circle cx="80" cy="120" r="4"/><circle cx="430" cy="100" r="3"/>
    <circle cx="70" cy="360" r="3"/><circle cx="440" cy="380" r="4"/>
    <circle cx="256" cy="60" r="3"/>
  </g>
  <!-- alien face, centered & large -->
  <g transform="translate(256,268)">
    <!-- antennae -->
    <g stroke="#1f9e4d" stroke-width="16" stroke-linecap="round">
      <line x1="-70" y1="-150" x2="-105" y2="-215"/>
      <line x1="70" y1="-150" x2="105" y2="-215"/>
    </g>
    <circle cx="-105" cy="-222" r="20" fill="#8affb0"/>
    <circle cx="105" cy="-222" r="20" fill="#8affb0"/>
    <!-- head -->
    <circle r="165" fill="url(#alien)"/>
    <!-- scalp shine -->
    <ellipse cx="-55" cy="-75" rx="70" ry="34" fill="#ffffff" opacity="0.32" transform="rotate(-28 -55 -75)"/>
    <!-- glasses -->
    <g stroke="#0a0e1f" fill="rgba(200,240,255,.9)">
      <circle cx="-62" cy="-10" r="58" stroke-width="18"/>
      <circle cx="62" cy="-10" r="58" stroke-width="18"/>
      <line x1="-4" y1="-10" x2="4" y2="-10" stroke-width="14"/>
      <line x1="-120" y1="-16" x2="-165" y2="-26" stroke-width="12" stroke-linecap="round"/>
      <line x1="120" y1="-16" x2="165" y2="-26" stroke-width="12" stroke-linecap="round"/>
    </g>
    <!-- pupils -->
    <circle cx="-62" cy="-10" r="22" fill="#0a0e1f"/>
    <circle cx="62" cy="-10" r="22" fill="#0a0e1f"/>
    <circle cx="-54" cy="-18" r="8" fill="#ffffff"/>
    <circle cx="70" cy="-18" r="8" fill="#ffffff"/>
    <!-- smile -->
    <path d="M-52,86 A64,64 0 0,0 52,86" fill="none" stroke="#0a0e1f" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
